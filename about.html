<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrowander | Our Story</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(0,0,0,0.3);
}

nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

nav a:hover {
    color: #38bdf8;
}

/* Hero Section */
.hero {
    padding: 80px 20px;
}

/* Text Animation */
.hero h1 {
    font-size: 48px;
    animation: fadeDown 1s ease;
}

.hero p {
    max-width: 600px;
    margin: auto;
    color: #cbd5e1;
    animation: fadeUp 1.5s ease;
}

/* SVG Animation */
.svg-box {
    margin-top: 40px;
    animation: float 4s ease-in-out infinite;
}

/* Animations */
@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Glow Effect */
circle {
    filter: drop-shadow(0 0 10px #3b82f6);
}
</style>
</head>

<body>

<header>
    <div><b>ELECTROWANDER</b></div>
    <nav>
        <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="youtube.html">Videos</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Our Story</h1>
    <p>
        Electrowander is dedicated to bridging the gap between basic concepts 
        and high-end technical mastery.
    </p>

    <div class="svg-box">
        <svg width="200" height="200" viewBox="0 0 100 100">
            <rect x="45" y="80" width="10" height="20" fill="#1a3c6e" />
            
            <circle cx="50" cy="50" r="30" fill="#3b82f6" opacity="0.6">
                <animate attributeName="r" values="25;35;25" dur="3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
            </circle>

            <path d="M30 50 L50 30 L70 50"
                  stroke="white"
                  stroke-width="4"
                  fill="none">
                <animate attributeName="stroke-dasharray"
                         values="0,100;100,0"
                         dur="2s"
                         repeatCount="indefinite"/>
            </path>
        </svg>
    </div>
</section>

</body>
</html>
