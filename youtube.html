<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroWander | Official Channels</title>
    <style>
        :root {
            --yt-red: #ff0000;
            --yt-black: #0f0f0f;
            --yt-white: #ffffff;
            --yt-grey: #aaaaaa;
        }

        body {
            background-color: var(--yt-black);
            color: var(--yt-white);
            font-family: "Roboto", Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Animated YouTube Logo --- */
        .logo-container {
            margin-bottom: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.1);
        }

        .yt-logo {
            width: 120px;
            height: 84px;
            background-color: var(--yt-red);
            border-radius: 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite ease-in-out;
        }

        /* The Play Triangle */
        .yt-logo::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 0 20px 35px;
            border-color: transparent transparent transparent var(--yt-white);
            margin-left: 5px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        /* --- Channel Cards --- */
        .channel-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            width: 320px;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #333;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            background: #2a2a2a;
            transform: translateY(-10px);
            border-color: var(--yt-red);
        }

        .banner {
            height: 100px;
            background: linear-gradient(45deg, #2c3e50, #ff0000);
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: #444;
            border-radius: 50%;
            margin: -60px auto 15px;
            border: 4px solid #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: var(--yt-white);
        }

        .channel-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .handle {
            color: var(--yt-grey);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .sub-button {
            background-color: var(--yt-white);
            color: var(--yt-black);
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            transition: 0.2s;
        }

        .card:hover .sub-button {
            background-color: var(--yt-red);
            color: var(--yt-white);
        }

        footer {
            margin-top: 60px;
            color: var(--yt-grey);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="yt-logo"></div>
    </div>

    <h1>Choose Your Channel</h1>

    <div class="channel-grid">
        <a href="https://www.youtube.com/@electrowander" class="card" target="_blank">
            <div class="banner"></div>
            <div class="content">
                <div class="avatar" style="background: #ff4500;">EW</div>
                <div class="channel-name">ElectroWander</div>
                <div class="handle">@electrowander</div>
                <div class="sub-button">Subscribe</div>
            </div>
        </a>
</head>
