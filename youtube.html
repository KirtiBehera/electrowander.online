<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElectroWander | Official Channels</title>

<style>
:root {
    --yt-red: #ff0000;
    --yt-black: #0f0f0f;
    --yt-white: #ffffff;
    --yt-grey: #aaaaaa;
}

body {
    background-color: var(--yt-black);
    color: var(--yt-white);
    font-family: "Roboto", Arial, sans-serif;
    margin: 0;
    text-align: center;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: #111;
}

nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

nav a:hover {
    color: var(--yt-red);
}

/* LOGO */
.logo-container {
    margin: 40px 0;
}

.yt-logo {
    width: 120px;
    height: 84px;
    background: var(--yt-red);
    border-radius: 25px;
    margin: auto;
    position: relative;
    animation: pulse 2s infinite;
}

.yt-logo::after {
    content: "";
    position: absolute;
    top: 22px;
    left: 45px;
    border-style: solid;
    border-width: 20px 0 20px 35px;
    border-color: transparent transparent transparent white;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.7);}
    70% { box-shadow: 0 0 0 30px rgba(255,0,0,0);}
    100% { box-shadow: 0 0 0 0 rgba(255,0,0,0);}
}

/* CHANNEL CARDS */
.channel-grid {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.card {
    background: #1e1e1e;
    width: 300px;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    transition: 0.4s;
    animation: fadeUp 1s ease;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    border: 1px solid var(--yt-red);
}

.banner {
    height: 100px;
    background: linear-gradient(45deg, #2c3e50, red);
}

.content {
    padding: 20px;
}

.avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: -60px auto 10px;
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sub-button {
    background: white;
    color: black;
    padding: 10px 20px;
    border-radius: 20px;
    margin-top: 10px;
}

.card:hover .sub-button {
    background: red;
    color: white;
}

/* WALKING CHARACTER */
.character {
    position: fixed;
    bottom: 20px;
    left: -100px;
    font-size: 40px;
    animation: walk 12s linear infinite;
}

@keyframes walk {
    0% { left: -100px; }
    100% { left: 110%; }
}

/* SPEECH BUBBLE */
.speech {
    position: fixed;
    bottom: 80px;
    left: 20px;
    background: white;
    color: black;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 14px;
    animation: fadeIn 2s ease;
}

/* ANIMATIONS */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px);}
    to { opacity: 1; transform: translateY(0);}
}

@keyframes fadeIn {
    from { opacity: 0;}
    to { opacity: 1;}
}

footer {
    margin-top: 50px;
    color: gray;
}
</style>
</head>

<body>

<header>
    <div><b>ELECTROWANDER</b></div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Videos</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="logo-container">
    <div class="yt-logo"></div>
</div>

<h1>Choose Your Channel</h1>

<div class="channel-grid">

    <a href="https://www.youtube.com/@electrowander" target="_blank" class="card">
        <div class="banner"></div>
        <div class="content">
            <div class="avatar">EW</div>
            <h3>ElectroWander</h3>
            <p>@electrowander</p>
            <div class="sub-button">Subscribe</div>
        </div>
    </a>

    <a href="https://www.youtube.com/@learngb2tb" target="_blank" class="card">
        <div class="banner" style="background:linear-gradient(45deg,#00c6ff,#0072ff);"></div>
        <div class="content">
            <div class="avatar">LT</div>
            <h3>LearnGB2TB</h3>
            <p>@learngb2tb</p>
            <div class="sub-button">Subscribe</div>
        </div>
    </a>

</div>

<!-- Character -->
<div class="character">🚶‍♂️</div>

<!-- Speech -->
<div class="speech">👆 Click a channel to explore amazing content!</div>

<footer>
    © 2026 ElectroWander Media
</footer>

</body>
</html>
