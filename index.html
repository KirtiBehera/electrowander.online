<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrowander | Home</title>

<style>
:root {
    --primary: #1a3c6e;
    --accent: #3b82f6;
}

/* BODY */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a3c6e);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

/* BACKGROUND ANIMATION */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

nav a {
    margin: 0 12px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

nav a:hover {
    color: #38bdf8;
}

/* HERO */
.hero {
    padding: 100px 20px;
}

/* Typing Effect */
.typing {
    font-size: 50px;
    border-right: 3px solid white;
    width: fit-content;
    margin: auto;
    white-space: nowrap;
    overflow: hidden;
    animation: typing 4s steps(30), blink 0.7s infinite;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

@keyframes blink {
    50% { border-color: transparent }
}

/* Subtitle */
.hero p {
    margin-top: 20px;
    color: #cbd5e1;
    animation: fadeUp 2s ease;
}

/* BUTTONS */
.buttons {
    margin-top: 30px;
}

.btn {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    margin: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}

.primary {
    background: #38bdf8;
    color: white;
}

.secondary {
    background: transparent;
    border: 1px solid white;
    color: white;
}

.btn:hover {
    transform: scale(1.1);
}

/* FLOATING BOXES */
.illustration {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 60px;
}

.box {
    width: 80px;
    height: 80px;
    border-radius: 15px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    animation: float 4s infinite ease-in-out;
    box-shadow: 0 0 20px rgba(59,130,246,0.6);
}

@keyframes float {
    0%,100% { transform: translateY(0) rotate(5deg); }
    50% { transform: translateY(-25px) rotate(15deg); }
}

/* FADE */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* FOOTER */
footer {
    margin-top: 80px;
    padding: 20px;
    font-size: 12px;
    color: #cbd5e1;
}
</style>
</head>

<body>

<header>
    <div><b>ELECTROWANDER</b></div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Videos</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">

    <div class="typing">Welcome to Electrowander</div>

    <p>
        Your gateway from basic knowledge to advanced technology.  
        Discover automation, AI, and innovation.
    </p>

    <div class="buttons">
        <button class="btn primary">Explore Services</button>
        <button class="btn secondary">View Projects</button>
    </div>

    <div class="illustration">
        <div class="box"></div>
        <div class="box" style="animation-delay:0.5s;"></div>
        <div class="box" style="animation-delay:1s;"></div>
        <div class="box" style="animation-delay:1.5s;"></div>
    </div>

</section>

<footer>
    © 2026 Electrowander. All rights reserved.
</footer>

</body>
</html>
