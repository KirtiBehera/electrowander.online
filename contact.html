<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrowander | Contact</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(0,0,0,0.3);
}

nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

nav a:hover {
    color: #38bdf8;
}

/* Hero */
.hero {
    padding: 70px 20px;
}

.hero h1 {
    font-size: 45px;
    animation: fadeDown 1s ease;
}

.hero p {
    color: #cbd5e1;
    animation: fadeUp 1.5s ease;
}

/* Icons */
.icons a {
    font-size: 40px;
    margin: 0 15px;
    text-decoration: none;
    display: inline-block;
    transition: 0.3s;
    animation: float 3s infinite ease-in-out;
}

.icons a:hover {
    transform: scale(1.2);
}

/* Form */
form {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    width: 320px;
    margin-left: auto;
    margin-right: auto;
    gap: 15px;
    animation: fadeUp 2s ease;
}

input, textarea {
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
}

textarea {
    resize: none;
    height: 100px;
}

button {
    background: #38bdf8;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0ea5e9;
    transform: scale(1.05);
}

/* Animations */
@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<header>
    <div><b>ELECTROWANDER</b></div>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Videos</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Contact Us</h1>
    <p>Email: contact@electrowander.com</p>

    <!-- Icons -->
    <div class="icons">
        <a href="https://www.youtube.com/@electrowander" target="_blank">📺</a>
        <a href="mailto:contact@electrowander.com">📧</a>
    </div>

    <!-- Form -->
    <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Your Message"></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

</body>
</html>
